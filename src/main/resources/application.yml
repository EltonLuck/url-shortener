spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/shortener
    username: shortener
    password: shortener
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379

  web:
    error:
      include-message: always

management:
  endpoint:
    health:
      show-details: always

